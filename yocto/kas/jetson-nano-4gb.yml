# Reproducible Yocto Build Manifest for Jetson Nano 4GB (OE4T / meta-tegra kirkstone-l4t-r32.7.x)
# Usage:
#   pip3 install kas
#   kas build yocto/kas/jetson-nano-4gb.yml

header:
  version: 14

machine: jetson-nano-devkit
distro: poky
target: jetson-ai-image

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: kirkstone
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: kirkstone
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra.git
    branch: kirkstone-l4t-r32.7.x
    layers:
      .:

  meta-jetson-ai-detect:
    path: yocto/meta-jetson-ai-detect

local_conf_header:
  systemd_and_tegra: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd opengl"
    IMAGE_CLASSES += "image_types_tegra"
    IMAGE_FSTYPES = "tegraflash"
    LICENSE_FLAGS_ACCEPTED += "commercial"
